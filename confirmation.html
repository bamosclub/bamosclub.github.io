<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Inscription confirmée · Bamos</title>
<link rel="icon" href="branding/favicon-64.png">
<style>
  :root { --canari: #FFD60A; --encre: #16161D; --papier: #FFF9EC; --blanc: #FFFFFF;
          --secondaire: #3A3A44; --contour: 2px solid #16161D; --rayon: 16px;
          --rayon-bouton: 12px; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--papier); color: var(--encre); font-family: Arial, Helvetica, sans-serif;
         font-size: 17px; line-height: 1.55; }
  .page { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  header img { width: 150px; height: auto; display: block; }
  .carte { margin-top: 28px; background: var(--blanc); border: var(--contour); border-radius: var(--rayon);
           padding: 26px 22px; box-shadow: 6px 6px 0 var(--encre); }
  h1 { margin: 0; font-family: &#39;Arial Black&#39;, Arial, Helvetica, sans-serif; font-weight: 900; font-size: 30px; line-height: 1.15; }
  h1 span { background: var(--canari); padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  p { margin: 14px 0 0; }
  h2 { margin: 26px 0 0; font-family: &#39;Arial Black&#39;, Arial, Helvetica, sans-serif; font-weight: 900; font-size: 19px; line-height: 1.25; }
  .petit { font-size: 15px; color: var(--secondaire); }
  .boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .bouton { display: inline-block; background: var(--encre); color: var(--canari); border: 0; border-radius: var(--rayon-bouton);
            padding: 13px 20px; font: bold 16px Arial, Helvetica, sans-serif; text-decoration: none; cursor: pointer; }
  .bouton.second { background: var(--blanc); color: var(--encre); border: var(--contour); }
  a { color: var(--encre); }
</style>
</head>
<body>
<div class="page">
  <header><a href="./"><img src="branding/logo-bamos-600.png" width="150" alt="Bamos"></a></header>
  <div class="carte">
    <h1>C’est <span>confirmé</span></h1>
    <p>Ton premier weekend arrive jeudi à 8 h, dans ta boîte mail.</p><p>Pour ne pas le rater, ajoute bonjour@bamosclub.com à tes contacts.</p>
    
    
    <div class="boutons">
      <a class="bouton" href="https://wa.me/?text=Je%20re%C3%A7ois%20Bamos%C2%A0%3A%20chaque%20jeudi%2C%20les%20vols%20directs%20au%20d%C3%A9part%20de%20Nantes%20qui%20tombent%20pile%20pour%20un%20weekend.%20C%E2%80%99est%20gratuit%C2%A0%3A%20https%3A//bamosclub.com" target="_blank" rel="noopener">Partager sur WhatsApp</a>
      <button class="bouton second" type="button" id="copier" data-lien="https://bamosclub.com">Copier le lien</button>
    </div>
    
    <p class="petit">Un ami qui part aussi de là ? Partage-lui Bamos.</p>
  </div>
  <p class="petit"><a href="./">Retour à l’accueil</a></p>
</div>

<script>
  document.getElementById("copier").addEventListener("click", function () {
    var bouton = this;
    navigator.clipboard.writeText(bouton.dataset.lien).then(function () { bouton.textContent = "Lien copié"; });
  });
</script>

</body>
</html>
